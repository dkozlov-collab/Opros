<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1d4ed8"/>
      <stop offset="55%"  stop-color="#2f7cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="txt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- Фон — скруглённый квадрат -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Внутренний блик -->
  <rect width="64" height="32" rx="14" fill="rgba(255,255,255,0.08)"/>

  <!-- Буква L — вертикальная палка -->
  <rect x="16" y="13" width="6" height="30" rx="3" fill="url(#txt)"/>
  <!-- Горизонтальная палка L -->
  <rect x="16" y="37" width="18" height="6" rx="3" fill="url(#txt)"/>

  <!-- Молния / pay-акцент (правый верхний угол) -->
  <polygon
    points="38,13 30,32 37,32 29,51 47,28 39,28 46,13"
    fill="url(#txt)"
    opacity="0.95"
  />
</svg>
